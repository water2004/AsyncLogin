name: CI and Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*\+mc26.1'
      - 'v*\+mc26.2'

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_meta.outputs.release_version }}
      minecraft_version: ${{ steps.release_meta.outputs.minecraft_version }}
      artifact_name: ${{ steps.release_meta.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+mc(26\.[12])$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            echo "Expected v<semver>+mc26.1 or v<semver>+mc26.2" >&2
            exit 1
          fi
          minecraft_version="${BASH_REMATCH[2]}"

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi

          release_version="${tag#v}"
          artifact_name="AsyncLogin-${release_version}.jar"

          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "minecraft_version=${minecraft_version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Build all supported versions
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace

      - name: Verify release artifact and metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.release_version }}
          MINECRAFT_VERSION: ${{ steps.release_meta.outputs.minecraft_version }}
          ARTIFACT_NAME: ${{ steps.release_meta.outputs.artifact_name }}
        shell: bash
        run: |
          module="minecraft-${MINECRAFT_VERSION}"
          metadata="${module}/build/resources/main/fabric.mod.json"
          artifact="${module}/build/libs/${ARTIFACT_NAME}"

          python3 - "${metadata}" "${RELEASE_VERSION}" <<'PY'
          import json
          import pathlib
          import sys

          metadata_path = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]
          actual_version = json.loads(metadata_path.read_text(encoding="utf-8"))["version"]
          if actual_version != expected_version:
              raise SystemExit(
                  f"Version mismatch: tag requests {expected_version}, "
                  f"but {metadata_path} contains {actual_version}"
              )
          PY

          if [[ ! -f "${artifact}" ]]; then
            echo "Expected release artifact not found: ${artifact}" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AsyncLogin-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            minecraft-26.1/build/libs/AsyncLogin-*.jar
            minecraft-26.2/build/libs/AsyncLogin-*.jar
            !**/*-sources.jar

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      MINECRAFT_VERSION: ${{ needs.build.outputs.minecraft_version }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: AsyncLogin-${{ github.sha }}
          path: dist

      - name: Render release notes
        shell: bash
        run: |
          artifact="$(find dist -type f -name "${ARTIFACT_NAME}" -print -quit)"
          if [[ -z "${artifact}" ]]; then
            echo "Downloaded artifact not found: ${ARTIFACT_NAME}" >&2
            exit 1
          fi
          echo "RELEASE_ARTIFACT=${artifact}" >> "${GITHUB_ENV}"

          python3 - <<'PY'
          import os
          import pathlib

          template = pathlib.Path("RELEASE.md").read_text(encoding="utf-8")
          replacements = {
              "{{VERSION}}": os.environ["RELEASE_VERSION"],
              "{{MINECRAFT_VERSION}}": os.environ["MINECRAFT_VERSION"],
              "{{ARTIFACT_NAME}}": os.environ["ARTIFACT_NAME"],
          }
          for placeholder, value in replacements.items():
              template = template.replace(placeholder, value)

          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          output.write_text(template, encoding="utf-8")
          PY

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "${RELEASE_ARTIFACT}" \
            --verify-tag \
            --target "${GITHUB_SHA}" \
            --title "AsyncLogin ${RELEASE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
